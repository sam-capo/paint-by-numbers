    <!-- Shown when every paintable SVG region has been filled. -->
    <dialog class="completion-dialog" aria-labelledby="completion-message">
        <p id="completion-message">Congratulations, you completed the painting! Now presenting... Autumn Harvest</p>
        <form method="dialog">
            <button type="submit">Close</button>
        </form>
    </dialog>
